<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STANSPACE ♡</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#f8f6fc;--white:#fff;--text:#30283b;--muted:#93889e;
--pink:#ed91b9;--purple:#9276c8;--soft:#f1eafb;
--border:#eee8f4;--shadow:0 6px 25px rgba(67,44,91,.07)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.brand{font-size:25px;font-weight:900;color:#765ca9;letter-spacing:-1px}
.brand span{color:var(--pink)}
.btn{border-radius:12px;padding:10px 16px;background:linear-gradient(135deg,#e995ba,#a58ad6);color:white;font-weight:bold}
.btn.secondary{background:var(--soft);color:#715b9c}
.btn.danger{background:#fff0f2;color:#c05d80}
.btn:disabled{opacity:.6;cursor:wait}
.topbar{height:68px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:10}
.layout{max-width:1200px;margin:25px auto;padding:0 15px;display:grid;grid-template-columns:205px minmax(0,1fr) 220px;gap:20px}
.sidebar,.rightbar{position:sticky;top:88px;align-self:start}
.navbox,.card,.panel{background:white;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
.navbox{padding:12px}
.navbtn{width:100%;text-align:left;padding:13px;border-radius:11px;background:transparent;color:var(--muted);font-weight:bold;margin:2px 0}
.navbtn:hover,.navbtn.active{background:var(--soft);color:#7258a1}
.navbtn span{display:inline-block;width:28px}
.nav-count{display:inline-grid;place-items:center;background:#e47ba8;color:white;border-radius:20px;min-width:18px;height:18px;font-size:10px;margin-left:5px;padding:0 5px}
.side-title{font-size:10px;letter-spacing:1.4px;color:#a79bb4;font-weight:bold;margin:20px 10px 8px}
.mini-community{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;font-size:12px;cursor:pointer}
.mini-community:hover{background:#faf7fd}
.dot,.tile-icon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#f8d8e6,#e2d8fa);display:grid;place-items:center;color:#795d9f;font-size:11px;font-weight:bold}
.main{min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:center;margin:2px 0 17px;gap:8px}
.page-head h1{font-size:24px;margin:0}
.sub{color:var(--muted);font-size:12px;margin-top:5px}
.card{padding:17px;margin-bottom:15px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f6c8dc,#cfc1f1);display:grid;place-items:center;color:#765ca9;font-weight:bold;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.composer{display:flex;gap:11px}
.composer textarea{width:100%;border:0;resize:vertical;min-height:55px;outline:none;font-size:14px}
.composer-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);gap:8px;flex-wrap:wrap}
.photo-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.photo-button{background:var(--soft);color:#765ca9;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:bold;cursor:pointer}
.photo-preview{display:none;margin-top:12px;position:relative;width:fit-content;max-width:100%}
.photo-preview img{display:block;max-width:100%;max-height:300px;object-fit:contain;border-radius:13px;border:1px solid var(--border)}
.remove-photo{position:absolute;top:7px;right:7px;background:#30283bcc;color:white;border-radius:50%;width:27px;height:27px}
.post-head{display:flex;align-items:center;gap:10px}
.post-name{font-weight:bold;font-size:13px;cursor:pointer}
.post-name:hover{color:#a34f7c}
.post-meta{font-size:11px;color:var(--muted);margin-top:3px}
.post-text{font-size:14px;line-height:1.6;margin:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.post-image{width:100%;max-height:560px;object-fit:contain;border-radius:13px;margin:4px 0 12px;background:#f8f6fc}
.post-actions{display:flex;gap:17px;border-top:1px solid var(--border);padding-top:11px;flex-wrap:wrap}
.action{background:transparent;color:var(--muted);font-size:12px;font-weight:bold;padding:4px}
.action.liked{color:#e47ba8}
.tag{display:inline-block;background:#f6effa;color:#886daf;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:bold}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:36px}
.community-hero{background:linear-gradient(120deg,#f9dce9,#e7ddf8);border-radius:18px;padding:22px;margin-bottom:15px}
.community-hero h2{margin:8px 0 4px}
.community-hero p{margin:0;color:#766b83;font-size:12px}
.community-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.community-tile{border:1px solid var(--border);border-radius:14px;padding:12px;background:white}
.community-tile strong{font-size:12px;display:block;margin:8px 0 3px}
.community-tile small{font-size:10px;color:var(--muted)}
.search,.field{width:100%;border:1px solid var(--border);border-radius:11px;padding:11px 12px;outline:none;margin:7px 0 12px}
.search:focus,.field:focus{border-color:#c5a6df;box-shadow:0 0 0 3px #f1eafb}
.profile-cover{height:120px;background:linear-gradient(110deg,#f7d6e5,#d9cef1);border-radius:17px;margin-bottom:-40px}
.profile-card{padding:0 18px 18px}
.profile-top{display:flex;align-items:end;justify-content:space-between;gap:10px}
.profile-top .avatar{width:80px;height:80px;border:5px solid white;font-size:22px}
.profile-name{font-size:21px;font-weight:900;margin:10px 0 2px}
.profile-bio{color:var(--muted);font-size:13px}
.stats{display:flex;gap:22px;margin:15px 0;flex-wrap:wrap}
.stats b{font-size:15px}
.stats span{display:block;font-size:10px;color:var(--muted)}
.stat-button{background:transparent;padding:0;text-align:left;color:var(--text)}
.stat-button:hover b{color:#a34f7c}
.modal-back{position:fixed;inset:0;background:#241a2d88;z-index:20;display:grid;place-items:center;padding:15px}
.modal{background:white;border-radius:20px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px}
.modal h2{margin:0 0 6px}
.modal p{font-size:12px;color:var(--muted)}
.label{font-size:11px;font-weight:bold}
.fandom-options{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-height:290px;overflow:auto}
.fandom-option{border:1px solid var(--border);border-radius:10px;padding:9px;display:flex;gap:7px;align-items:center;font-size:11px;cursor:pointer}
.fandom-option.selected{background:#f7effa;border-color:#c8b2e3}
.notice{background:#fff7e9;color:#8a693d;border-radius:11px;padding:11px;font-size:11px;line-height:1.5;margin:12px 0}
.comment{font-size:12px;padding:9px 0;color:#63586d;border-bottom:1px solid #f3eff6}
.comment-person{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.comment-person .avatar{width:27px;height:27px;font-size:11px}
.comment-person b{cursor:pointer}
.comment-person b:hover{color:#a34f7c}
.comment-row{display:flex;gap:7px;margin-top:8px}
.comment-row input{flex:1;min-width:0;border:1px solid var(--border);border-radius:9px;padding:8px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#33283f;color:white;padding:11px 17px;border-radius:30px;font-size:12px;z-index:50;max-width:90%;text-align:center}
.mobile-nav{display:none}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#f8dce9 0,transparent 35%),radial-gradient(circle at 80% 80%,#e8e0f7 0,transparent 38%),var(--bg)}
.auth-card{width:min(480px,100%);background:white;border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.auth-tabs{display:flex;gap:8px;margin:20px 0}
.auth-tabs button{flex:1;padding:11px;border-radius:10px;background:#f5f0f8;color:#806b92}
.auth-tabs button.active{background:#f7dfeb;color:#a34f7c}
.loading{text-align:center;padding:60px 15px;color:var(--muted)}
.clickable{cursor:pointer}
.auth-link{display:block;text-align:center;margin:14px 0 0;color:#9874bc;font-size:12px;font-weight:bold;text-decoration:none;cursor:pointer}
.auth-link:hover{text-decoration:underline}
.person-row,.notification-row{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--border)}
.person-row:last-child,.notification-row:last-child{border-bottom:0}
.person-info,.notification-info{flex:1;min-width:0}
.person-info b,.notification-info b{font-size:13px}
.person-info .sub,.notification-info .sub{font-size:11px}
.notification-row{cursor:pointer;border-radius:10px}
.notification-row:hover{background:#faf7fd}
.notification-row.unread{background:#fcf4f9}
.notification-dot{width:9px;height:9px;border-radius:50%;background:#e47ba8;flex-shrink:0}
.notification-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f5eafa;color:#9b70bd;flex-shrink:0;font-size:17px}
.unread-label{font-size:10px;color:#a34f7c;font-weight:bold}

/* PRIVATE MESSAGES */
.messages-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;min-height:420px}
.messages-list{max-height:540px;overflow:auto}
.conversation-item{display:flex;align-items:center;gap:9px;padding:11px;border-radius:12px;cursor:pointer;border-bottom:1px solid var(--border)}
.conversation-item:hover,.conversation-item.selected{background:var(--soft)}
.conversation-info{flex:1;min-width:0}
.conversation-info b{font-size:12px}
.conversation-info .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-panel{display:flex;flex-direction:column;min-height:420px}
.chat-header{padding:10px;border-bottom:1px solid var(--border);font-weight:bold;display:flex;align-items:center;gap:9px}
.chat-body{flex:1;padding:12px;overflow:auto;max-height:420px;display:flex;flex-direction:column;gap:9px}
.message-bubble{max-width:78%;padding:10px 12px;border-radius:15px;background:#f1eafb;font-size:13px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap;align-self:flex-start}
.message-bubble.mine{background:#f9e0eb;align-self:flex-end}
.message-time{font-size:9px;color:var(--muted);margin-top:5px}
.chat-compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
.chat-compose input{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;padding:11px;outline:none}
.chat-compose button{flex-shrink:0}
.message-policy{background:#f8f3fc;color:#765ca9;border-radius:11px;padding:10px;font-size:11px;line-height:1.5;margin-top:10px}

@media(max-width:900px){.layout{grid-template-columns:180px minmax(0,1fr)}.rightbar{display:none}}
@media(max-width:640px){
#pageContent{
  padding-bottom:110px !important;
}

.topbar{height:60px;padding:0 13px}
.layout{display:block;margin:16px auto;padding:0 11px 82px}
.sidebar,.rightbar{display:none}
.mobile-nav{
  position:fixed;
  bottom:58px;
  left:0;
  right:0;
  background:white;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-start;
  overflow-x:auto;
  padding:8px 5px env(safe-area-inset-bottom);
  z-index:100;
  gap:4px;
}
.modal-back{
  align-items:flex-start;
  overflow-y:auto;
  padding:20px 12px 110px;
}

.modal{
  max-height:calc(100dvh - 130px);
  overflow-y:auto;
  margin:auto;
}
.bottom-doodles{
  position:fixed;
  bottom:7px;
  left:0px;
  width:calc(100% - 135px);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:17px;
  color:#a99bd1;
  font-size:21px;
  opacity:.9;
  pointer-events:none;
  z-index:9;
  letter-spacing:2px;
}
.mobile-nav button{
  background:transparent;
  color:var(--muted);
  font-size:9px;
  font-weight:bold;
  min-width:64px;
  flex:0 0 64px;
  padding:4px 2px;
}
.mobile-nav span{display:block;font-size:16px;margin-bottom:3px}
.community-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{padding:13px}
.messages-layout{grid-template-columns:1fr}
.messages-list{max-height:220px}
.chat-panel{min-height:380px}
}
</style>
</head>

<input class="field" id="username" maxlength="20" placeholder="your_username">
<label class="label">Country</label>

<input type="checkbox" value="${esc(f)}" onchange="this.parentElement.classList.toggle('selected',this.checked)">
<span><b>${esc(f)}</b><br><small>${esc(g)}</small></span>

}

// FORGOT PASSWORD
function showForgotPassword(message=""){
recoveryMode=false;
$("app").innerHTML=`
<div class="auth-wrap"><div class="auth-card">
<div class="brand">STANSPACE<span> ♡</span></div>
<h2 style="margin-top:22px">Forgot your password?</h2>
<p style="color:var(--muted);font-size:13px;line-height:1.6">No worries! Enter the email address connected to your account. We'll send you a link to reset your password.</p>
${message?`<div class="notice">${esc(message)}</div>`:""}
<form id="forgotForm">
<label class="label">Email address</label>
<input class="field" id="forgotEmail" type="email" required placeholder="you@example.com">
<button class="btn" id="resetEmailButton" style="width:100%;margin-top:10px" type="submit">Send reset link ♡</button>
</form>
<a class="auth-link" onclick="showAuth('login')">← Back to login</a>
</div></div>`;
$("forgotForm").onsubmit=sendResetEmail;
}
async function sendResetEmail(e){
e.preventDefault();
const email=$("forgotEmail").value.trim(),button=$("resetEmailButton");
button.disabled=true;button.textContent="Sending...";
const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin});
if(error){toast("Could not send email: "+error.message);button.disabled=false;button.textContent="Send reset link ♡";return}
showForgotPassword("If an account exists with this email, a password-reset link has been sent. Please check your inbox and spam folder.");
}
function showResetPassword(message=""){
recoveryMode=true;
$("app").innerHTML=`
<div class="auth-wrap"><div class="auth-card">
<div class="brand">STANSPACE<span> ♡</span></div>
<h2 style="margin-top:22px">Create a new password ♡</h2>
<p style="color:var(--muted);font-size:13px;line-height:1.6">You're almost back! Choose a new password for your STANSPACE account.</p>
${message?`<div class="notice">${esc(message)}</div>`:""}
<form id="newPasswordForm">
<label class="label">New password</label>
<input class="field" id="newPassword" type="password" minlength="8" required placeholder="At least 8 characters">
<label class="label">Confirm new password</label>
<input class="field" id="confirmPassword" type="password" minlength="8" required placeholder="Enter your new password again">
<button class="btn" id="savePasswordButton" style="width:100%;margin-top:10px" type="submit">Save new password ♡</button>
</form></div></div>`;
$("newPasswordForm").onsubmit=saveNewPassword;
}
async function saveNewPassword(e){
e.preventDefault();
const password=$("newPassword").value,confirmPassword=$("confirmPassword").value;
if(password.length<8){toast("Your password must be at least 8 characters.");return}
if(password!==confirmPassword){toast("Your passwords do not match.");return}
const button=$("savePasswordButton");button.disabled=true;button.textContent="Saving...";
const {error}=await db.auth.updateUser({password});
if(error){toast("Could not update password: "+error.message);button.disabled=false;button.textContent="Save new password ♡";return}
recoveryMode=false;toast("Password changed successfully! ♡");await loadApp();
}
function filterFandoms(){
const q=$("fandomSearch").value.toLowerCase();
document.querySelectorAll("#fandomOptions label").forEach(el=>el.style.display=el.innerText.toLowerCase().includes(q)?"flex":"none");
}
async function authenticate(e,mode){
e.preventDefault();
const email=$("email").value.trim(),password=$("password").value;
let result;
if(mode==="login"){result=await db.auth.signInWithPassword({email,password})}
else{
const username=$("username").value.trim().toLowerCase(),display_name=$("displayName").value.trim(),country=$("country").value.trim(),fandoms=selectedFandomNames();
if(!/^[a-z0-9_]{3,20}$/.test(username)){toast("Username must be 3–20 characters: letters, numbers or underscores.");return}
if(!display_name){toast("Please enter a display name.");return}
if(!fandoms.length){toast("Choose at least one fandom.");return}
result=await db.auth.signUp({email,password,options:{data:{username,display_name,country,fandoms}}});
if(!result.error&&!result.data.session){showAuth("login","Your account request was submitted! Check your email to confirm your account, then log in.");return}
}
if(result.error){toast(result.error.message);return}
session=result.data.session;if(session)await loadApp();
}

// LOAD USER DATA

async function loadApp(){
  const {data:{user},error:userError}=await db.auth.getUser();

  if(userError||!user){
    showAuth("login");
    return;
  }

  currentUser=user;

  const {data:p,error:profileError}=await db.from("profiles")
    .select("*")
    .eq("id",user.id)
    .single();

  if(profileError){
    toast("Could not load your profile: "+profileError.message);
    return;
  }

  profile=p;
  profile.avatarDisplayUrl=null;

  // Load profile picture from private storage
  if(profile.avatar_url){
    if(profile.avatar_url.startsWith("http")){
      profile.avatarDisplayUrl=profile.avatar_url;
    }else{
      const {data:imageData,error:imageError}=await db.storage
        .from("stanspace-images")
        .createSignedUrl(profile.avatar_url,3600);

      if(!imageError&&imageData){
        profile.avatarDisplayUrl=imageData.signedUrl;
      }
    }
  }

  const {data:members,error:memberError}=await db.from("user_fandoms")
    .select("fandom_id,fandoms(name)")
    .eq("user_id",user.id);

  if(memberError){
    toast("Could not load your fandoms.");
    return;
  }

  myFandoms=(members||[])
    .map(x=>x.fandoms?.name)
    .filter(Boolean);

  await Promise.all([
    loadPosts(),
    loadRelationships(),
    loadNotifications()
  ]);

  await loadUnreadMessages();

  render();
}


async function loadPosts(){
  const {data,error}=await db.from("posts")
    .select("*,profiles(username,display_name,avatar_url),fandoms(name)")
    .order("created_at",{ascending:false})
    .limit(100);

  if(error){
    toast("Could not load posts: "+error.message);
    posts=[];
    return;
  }

  posts=data||[];

  // Generate signed URLs for post images and author pictures
  for(const post of posts){
    post.imageDisplayUrl=null;

    if(post.image_url){
      const {data:imageData,error:imageError}=await db.storage
        .from("stanspace-images")
        .createSignedUrl(post.image_url,3600);

      if(!imageError&&imageData){
        post.imageDisplayUrl=imageData.signedUrl;
      }
    }

    const authorProfile=post.profiles;

    if(authorProfile){
      authorProfile.avatarDisplayUrl=null;

      if(authorProfile.avatar_url){
        if(authorProfile.avatar_url.startsWith("http")){
          authorProfile.avatarDisplayUrl=authorProfile.avatar_url;
        }else{
          const {data:imageData,error:imageError}=await db.storage
            .from("stanspace-images")
            .createSignedUrl(authorProfile.avatar_url,3600);

          if(!imageError&&imageData){
            authorProfile.avatarDisplayUrl=imageData.signedUrl;
          }
        }
      }
    }
  }

  if(posts.length){
    const ids=posts.map(p=>p.id);

    const [l,c]=await Promise.all([
      db.from("likes")
        .select("post_id,user_id")
        .in("post_id",ids),

      db.from("comments")
        .select("id,post_id,user_id,content,created_at,profiles(username,display_name,avatar_url)")
        .in("post_id",ids)
        .order("created_at")
    ]);

    likes=l.data||[];
    comments=c.data||[];

    // Generate signed URLs for commenter pictures
    for(const comment of comments){
      const commenterProfile=comment.profiles;

      if(!commenterProfile)continue;

      commenterProfile.avatarDisplayUrl=null;

      if(commenterProfile.avatar_url){
        if(commenterProfile.avatar_url.startsWith("http")){
          commenterProfile.avatarDisplayUrl=commenterProfile.avatar_url;
        }else{
          const {data:imageData,error:imageError}=await db.storage
            .from("stanspace-images")
            .createSignedUrl(commenterProfile.avatar_url,3600);

          if(!imageError&&imageData){
            commenterProfile.avatarDisplayUrl=imageData.signedUrl;
          }
        }
      }
    }

  }else{
    likes=[];
    comments=[];
  }
}
async function loadRelationships(){
const {data,error}=await db.from("follows").select("follower_id,following_id,created_at");
if(error){toast("Could not load follows: "+error.message);relationships=[];return}
relationships=data||[];
}

// NOTIFICATIONS
async function loadNotifications(){
const {data,error}=await db.from("notifications")
.select("id,recipient_id,actor_id,type,post_id,created_at,read_at")
.eq("recipient_id",currentUser.id)
.order("created_at",{ascending:false}).limit(100);
if(error){console.error("Notifications:",error.message);notifications=[];return}
notifications=data||[];
const actorIds=[...new Set(notifications.map(n=>n.actor_id))];
if(!actorIds.length)return;
const {data:people}=await db.from("profiles")
.select("id,username,display_name,avatar_url").in("id",actorIds);
const profilesById={};
(people||[]).forEach(p=>profilesById[p.id]=p);
notifications=notifications.map(n=>({...n,actor:profilesById[n.actor_id]||null}));
}
function unreadCount(){return notifications.filter(n=>!n.read_at).length}
async function markNotificationRead(id){
const {error}=await db.from("notifications").update({read_at:new Date().toISOString()}).eq("id",id).eq("recipient_id",currentUser.id);
if(error){toast("Could not mark as read: "+error.message);return false}
const n=notifications.find(x=>x.id===id);if(n)n.read_at=new Date().toISOString();
return true;
}
async function markAllNotificationsRead(){
const unread=notifications.filter(n=>!n.read_at);
if(!unread.length){toast("You're all caught up! ♡");return}
const {error}=await db.from("notifications").update({read_at:new Date().toISOString()}).eq("recipient_id",currentUser.id).is("read_at",null);
if(error){toast("Could not update notifications: "+error.message);return}
notifications.forEach(n=>n.read_at=n.read_at||new Date().toISOString());
renderNotifications();updateNotificationBadges();toast("All notifications marked as read ♡");
}

async function renderNotifications(){

  await loadNotifications();

  $("pageContent").innerHTML=`
    <div class="page-head">
      <div>
        <h1>Notifications</h1>
        <div class="sub">Your latest STANSPACE activity. ♡</div>
      </div>
    </div>

    <div class="card">
      ${
        notifications.length
        ? notifications.map(n=>`
          <div class="settings-row"
            style="padding:14px 5px;cursor:pointer;${n.read_at?"":"background:var(--soft);"}"
            onclick="openNotification('${n.id}')">

            <div style="display:flex;align-items:center;gap:12px">
              <div style="font-size:22px">
                ${notificationSymbol(n.type)}
              </div>
              <div>
                <div>${notificationMessage(n)}</div>
                <div class="sub">${formatDate(n.created_at)}</div>
              </div>
            </div>

            ${n.read_at?"":'<span class="nav-count">New</span>'}
          </div>
        `).join("")

      }

}
function notificationMessage(n){
const name=n.actor?.display_name||n.actor?.username||"Someone";
if(n.type==="like")return `<b>${esc(name)}</b> liked your post.`;
if(n.type==="comment")return `<b>${esc(name)}</b> commented on your post.`;
if(n.type==="follow")return `<b>${esc(name)}</b> started following you.`;
return "You have a new notification.";
}
function notificationSymbol(type){
return type==="like"?"♥":type==="comment"?"💬":"♡";
}
async function openNotification(id){
const n=notifications.find(x=>x.id===id);if(!n)return;
await markNotificationRead(id);
updateNotificationBadges();
if(n.actor_id){await openUserProfile(n.actor_id)}
}
function updateNotificationBadges(){
const count=unreadCount();
document.querySelectorAll("[data-notification-count]").forEach(el=>{
el.textContent=count;el.classList.toggle("hidden",count===0);
});
}

// PRIVATE MESSAGES
function isMutualFollower(userId){
  return amFollowing(userId)&&relationships.some(
    x=>x.follower_id===userId&&x.following_id===currentUser.id
  );
}

async function loadUnreadMessages(){
  if(!currentUser)return;

  const {count,error}=await db.from("messages")
    .select("id",{count:"exact",head:true})
    .eq("receiver_id",currentUser.id)
    .is("read_at",null);

  if(error){
    console.error("Unread messages:",error.message);
    unreadMessages=0;
  }else{
    unreadMessages=count||0;
  }

  updateMessageBadges();
}

function updateMessageBadges(){
  document.querySelectorAll("[data-message-count]").forEach(el=>{
    el.textContent=unreadMessages;
    el.classList.toggle("hidden",unreadMessages===0);
  });
}

async function loadMessageRows(){
  const [sent,received]=await Promise.all([
    db.from("messages").select("*")
      .eq("sender_id",currentUser.id)
      .order("created_at",{ascending:true}).limit(500),

    db.from("messages").select("*")
      .eq("receiver_id",currentUser.id)
      .order("created_at",{ascending:true}).limit(500)
  ]);

  if(sent.error||received.error){
    toast("Could not load messages: "+(sent.error||received.error).message);
    return false;
  }

  messageRows=[...new Map(
    [...(sent.data||[]),...(received.data||[])].map(m=>[m.id,m])
  ).values()].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));

  const otherIds=[...new Set([
    ...messageRows.map(m=>
      m.sender_id===currentUser.id?m.receiver_id:m.sender_id
    ),
    ...(activeConversationId?[activeConversationId]:[])
  ])];

  messagePeople={};

  if(otherIds.length){
    const {data,error}=await db.from("profiles")
      .select("id,username,display_name,avatar_url")
      .in("id",otherIds);

    if(error){
      toast("Could not load conversation profiles: "+error.message);
      return false;
    }

    (data||[]).forEach(p=>messagePeople[p.id]=p);
  }

  return true;
}

function conversationList(){
  const latest={};

  messageRows.forEach(m=>{
    const other=m.sender_id===currentUser.id?m.receiver_id:m.sender_id;

    if(!latest[other]||new Date(m.created_at)>new Date(latest[other].created_at)){
      latest[other]=m;
    }
  });

  const ids=Object.keys(latest).sort((a,b)=>
    new Date(latest[b].created_at)-new Date(latest[a].created_at)
  );

  return ids.map(id=>{
    const p=messagePeople[id]||{};
    const last=latest[id];

    const unread=messageRows.some(m=>
      m.sender_id===id&&m.receiver_id===currentUser.id&&!m.read_at
    );

    return {id,person:p,last,unread};
  });
}

async function openConversation(userId){

  if(!currentUser || userId===currentUser.id)return;

  const {data:blocks,error}=await db
    .from("user_blocks")
    .select("id")
    .or(
      `and(blocker_id.eq.${currentUser.id},blocked_id.eq.${userId}),and(blocker_id.eq.${userId},blocked_id.eq.${currentUser.id})`
    );

  if(error){
    console.error(error);
    toast("Could not verify block status.");
    return;
  }

  if(blocks && blocks.length){
    toast("You cannot message this user.");
    return;
  }

  if(!isMutualFollower(userId)){
    toast("You must follow each other to message.");
    return;
  }

  activeConversationId=userId;
  currentPage="messages";

  await renderMessages();
}
async function renderMessages(){
  const page=$("pageContent");
  if(!page)return;

  page.innerHTML=`
    <div class="page-head">
      <div>
        <h1>Messages ♡</h1>
        <div class="sub">Private conversations with your mutual followers.</div>
      </div>
      <button class="btn secondary" onclick="renderMessages()">Refresh</button>
    </div>

    <div class="notice">
      Private messaging is available only between mutual followers.
      You and the other person must follow each other to start a conversation.
    </div>

    <div class="messages-layout">
      <div class="card messages-list" id="conversationList">
        <div class="empty">Loading conversations... ♡</div>
      </div>

      <div class="card chat-panel" id="chatPanel">
        <div class="empty">
          <div class="big">♡</div>
          <h3>Your messages live here</h3>
          <p>Choose a conversation to get started.</p>
        </div>
      </div>
    </div>
  `;

  const ok=await loadMessageRows();
  if(!ok)return;

  const conversations=conversationList();
  const list=$("conversationList");

  list.innerHTML=conversations.length?conversations.map(c=>`
    <div class="conversation-item ${activeConversationId===c.id?"selected":""}"
      onclick="selectConversation('${c.id}')">
      ${avatar(c.person.display_name||c.person.username)}
      <div class="conversation-info">
        <b>${esc(c.person.display_name||c.person.username||"K-pop fan")}</b>
        <div class="sub">${esc(c.last.content)}</div>
      </div>
      ${c.unread?`<span class="notification-dot"></span>`:""}
    </div>
  `).join(""):`
    <div class="empty">
      <div class="big">♡</div>
      <p>No conversations yet.</p>
      <small>Visit someone's profile and follow each other to start chatting.</small>
    </div>
  `;

  if(activeConversationId){
    const person=messagePeople[activeConversationId];

    if(person&&isMutualFollower(activeConversationId)){
      await showConversation(activeConversationId);
    }else{
      activeConversationId=null;
      $("chatPanel").innerHTML=`
        <div class="empty">
          <p>You can only message mutual followers.</p>
        </div>
      `;
    }
  }

  await loadUnreadMessages();
}

async function selectConversation(userId){

  if(!currentUser)return;

  const {data:blocks,error}=await db
    .from("user_blocks")
    .select("id")
    .or(
      `and(blocker_id.eq.${currentUser.id},blocked_id.eq.${userId}),and(blocker_id.eq.${userId},blocked_id.eq.${currentUser.id})`
    );

  if(error){
    console.error(error);
    toast("Could not verify block status.");
    return;
  }

  if(blocks && blocks.length){
    toast("You cannot message this user.");
    activeConversationId=null;
    await renderMessages();
    return;
  }

  if(!isMutualFollower(userId)){
    toast("You must follow each other to message.");
    return;
  }

  activeConversationId=userId;
  await showConversation(userId);

  document.querySelectorAll(".conversation-item").forEach(el=>{
    el.classList.remove("selected");
  });
}
async function showConversation(userId){
  const panel=$("chatPanel");
  if(!panel)return;

  const person=messagePeople[userId];
  if(!person)return;

  const conversation=messageRows.filter(m=>
    (m.sender_id===currentUser.id&&m.receiver_id===userId)||
    (m.sender_id===userId&&m.receiver_id===currentUser.id)
  );

  const unread=conversation.filter(m=>
    m.sender_id===userId&&m.receiver_id===currentUser.id&&!m.read_at
  );

  if(unread.length){
    const {error}=await db.from("messages")
      .update({read_at:new Date().toISOString()})
      .eq("sender_id",userId)
      .eq("receiver_id",currentUser.id)
      .is("read_at",null);

    if(error){
      console.error("Could not mark messages read:",error.message);
    }else{
      unread.forEach(m=>m.read_at=new Date().toISOString());
      await loadUnreadMessages();
    }
  }

  panel.innerHTML=`
    <div class="chat-header">
      ${avatar(person.display_name||person.username)}
      <div style="flex:1;cursor:pointer" onclick="openUserProfile('${userId}')">
        ${esc(person.display_name||person.username)}
        <div class="sub">@${esc(person.username)}</div>
      </div>
      <button class="btn secondary" onclick="openUserProfile('${userId}')">Profile</button>
    </div>

    <div class="chat-body" id="chatBody">
      ${conversation.length?conversation.map(m=>`
        <div class="message-bubble ${m.sender_id===currentUser.id?"mine":""}">
          ${esc(m.content)}
          <div class="message-time">${formatDate(m.created_at)}</div>
        </div>
      `).join(""):`
        <div class="empty">
          <div class="big">♡</div>
          <p>Say hello! Start your conversation.</p>
        </div>
      `}
    </div>

    <div class="chat-compose">
      <input id="messageInput" maxlength="2000" placeholder="Write a private message...">
      <button class="btn" id="sendMessageButton" onclick="sendMessage('${userId}')">Send</button>
    </div>
  `;

  const body=$("chatBody");
  if(body)body.scrollTop=body.scrollHeight;

  $("messageInput").onkeydown=e=>{
    if(e.key==="Enter"&&!e.shiftKey){
      e.preventDefault();
      sendMessage(userId);
    }
  };
}

async function sendMessage(userId){

  if(!currentUser || userId===currentUser.id)return;

  const input=$("messageInput");
  const content=input?.value.trim();

  if(!content)return;

  // Check whether either user has blocked the other
  const {data:blocks,error:blockError}=await db
    .from("user_blocks")
    .select("id")
    .or(
      `and(blocker_id.eq.${currentUser.id},blocked_id.eq.${userId}),and(blocker_id.eq.${userId},blocked_id.eq.${currentUser.id})`
    );

  if(blockError){
    console.error(blockError);
    toast("Could not verify block status.");
    return;
  }

  if(blocks && blocks.length){
    toast("You cannot message this user.");
    return;
  }

  if(!isMutualFollower(userId)){
    toast("You must follow each other to message.");
    return;
  }

  const button=$("sendMessageButton");

  if(button){
    button.disabled=true;
    button.textContent="Sending...";
  }

  const {error}=await db.from("messages").insert({
    sender_id:currentUser.id,
    receiver_id:userId,
    content
  });

  if(error){
    toast("Could not send message: "+error.message);

    if(button){
      button.disabled=false;
      button.textContent="Send";
    }

    return;
  }

  await renderMessages();
}
// NAVIGATION
function navButton(icon,label,page){
const count=page==="notifications"?unreadCount():page==="messages"?unreadMessages:0;
const attribute=page==="notifications"?"data-notification-count":page==="messages"?"data-message-count":"";

async function submitFeedback(event){
  event.preventDefault();

    return;
  }

  const type=$("reportType").value;
  const category=$("reportCategory").value;
  const subject=$("reportSubject").value.trim();
  const message=$("reportMessage").value.trim();
  const button=$("reportSubmitButton");

  if(!subject||!message||!category){
    toast("Please complete all fields.");
    return;
  }

  button.disabled=true;
  button.textContent="Submitting...";

  const {error}=await db.from("feedback_reports").insert({
    user_id:currentUser.id,
    type,
    category,
    subject,
    message
  });

  button.disabled=false;
  button.textContent="Submit ♡";

  if(error){
    console.error(error);
    toast("Could not submit. Please try again.");
    return;
  }

  $("feedbackForm").reset();
  toast("Thank you! Your submission has been received. ♡");
}

async function updateReportStatus(reportId,status){
  if(!currentUser || currentUser.id!=="2c7a96a7-24ea-4eac-9988-8edfba7f5899")return;

  if(!["new","reviewing","resolved"].includes(status))return;

  const {error}=await db.from("feedback_reports")
    .update({status})
    .eq("id",reportId);

  if(error){
    console.error(error);
    toast("Could not update status.");
    return;
  }

  toast("Submission status updated! ♡");
}

// PHOTO PICKER
function choosePhoto(input){
const file=input.files?.[0];if(!file)return;
if(!file.type.startsWith("image/")){toast("Please choose an image file.");input.value="";return}
if(file.size>5*1024*1024){toast("Your photo must be smaller than 5 MB.");input.value="";return}
if(previewUrl)URL.revokeObjectURL(previewUrl);
selectedPhoto=file;previewUrl=URL.createObjectURL(file);
const preview=$("photoPreview");
preview.innerHTML=`<img src="${previewUrl}" alt="Photo preview"><button class="remove-photo" type="button" onclick="removePhoto()">×</button>`;
preview.style.display="block";
}
function removePhoto(){
selectedPhoto=null;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;
const input=$("photoInput");if(input)input.value="";
const preview=$("photoPreview");if(preview){preview.innerHTML="";preview.style.display="none"}
}

async function createPost(fandom=null){
const content=$("postContent")?.value.trim()||"",file=selectedPhoto;
if(!content&&!file){toast("Write something or add a photo first!");return}
const button=$("postButton");if(button){button.disabled=true;button.textContent="Posting..."}
let imagePath=null;
try{
if(file){
const extension=file.name.split(".").pop().toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
imagePath=`${currentUser.id}/${crypto.randomUUID()}.${extension}`;
const {error:uploadError}=await db.storage.from("stanspace-images").upload(imagePath,file,{contentType:file.type,upsert:false});
if(uploadError)throw uploadError;
}
let fandomId=null;
if(fandom){
const {data:fandomRow,error:fandomError}=await db.from("fandoms").select("id").eq("name",fandom).single();
if(fandomError)throw new Error("Could not find this fandom in the database: "+fandomError.message);
fandomId=fandomRow.id;
}
const {error}=await db.from("posts").insert({user_id:currentUser.id,content:content,image_url:imagePath,fandom_id:fandomId});
if(error)throw error;
removePhoto();toast("Your post is live ♡");await loadPosts();
if(fandom)openFandom(fandom);else if(currentPage==="profile")renderProfile();else renderHome();
}catch(error){
toast("Could not publish: "+error.message);
if(imagePath)await db.storage.from("stanspace-images").remove([imagePath]);
if(button){button.disabled=false;button.textContent="Post ♡"}
}
}

</div>
${fandom?`<span class="tag">${esc(fandom)}</span>`:""}
${post.user_id===currentUser.id?`<button class="action" onclick="deletePost('${post.id}')">•••</button>`:""}

</div>
<div id="comments-${post.id}" class="hidden">
${postComments.map(c=>{
const commenter=c.profiles?.display_name||c.profiles?.username||"K-pop fan";
return `<div class="comment">
<div class="comment-person">
<div class="clickable" onclick="openUserProfile('${c.user_id}')">${avatar(commenter,c.profiles?.avatarDisplayUrl)}</div>

<div class="post-meta">@${esc(c.profiles?.username||"fan")} · ${formatDate(c.created_at)}</div></div>
</div>
<div>${esc(c.content)}</div>
</div>`;
}).join("")}
<div class="comment-row">
<input id="comment-${post.id}" maxlength="500" placeholder="Write a comment...">
<button class="btn" onclick="addComment('${post.id}')">Send</button>
</div></div></article>`;
}
function toggleComments(id){$("comments-"+id)?.classList.toggle("hidden")}
async function toggleLike(postId){
const existing=likes.find(x=>x.post_id===postId&&x.user_id===currentUser.id);
const result=existing?await db.from("likes").delete().eq("post_id",postId).eq("user_id",currentUser.id):await db.from("likes").insert({post_id:postId,user_id:currentUser.id});
if(result.error){toast(result.error.message);return}
await loadPosts();refreshCurrentFeed();
}
async function addComment(postId){
const input=$("comment-"+postId),content=input?.value.trim();if(!content)return;
const {error}=await db.from("comments").insert({post_id:postId,user_id:currentUser.id,content});
if(error){toast(error.message);return}
await loadPosts();refreshCurrentFeed();
$("comments-"+postId)?.classList.remove("hidden");
}
async function deletePost(id){
if(!confirm("Delete this post?"))return;
const post=posts.find(p=>p.id===id);
const {error}=await db.from("posts").delete().eq("id",id).eq("user_id",currentUser.id);
if(error){toast(error.message);return}
if(post?.image_url)await db.storage.from("stanspace-images").remove([post.image_url]);
await loadPosts();refreshCurrentFeed();toast("Post deleted.");
}

async function searchPeople(){

const request=++peopleSearchRequest;
if(!q){results.innerHTML=`<div class="empty"><div class="big">♡</div><p>Start typing to find people.</p></div>`;return}
results.innerHTML=`<div class="empty">Searching for people... ♡</div>`;
const columns="id,username,display_name,country,avatar_url,bio";
const [byUsername,byName]=await Promise.all([
db.from("profiles").select(columns).ilike("username",`%${q}%`).limit(20),
db.from("profiles").select(columns).ilike("display_name",`%${q}%`).limit(20)
]);
if(request!==peopleSearchRequest||!$("peopleResults"))return;
if(byUsername.error||byName.error){
console.error("People search:",byUsername.error||byName.error);
results.innerHTML=`<div class="empty"><p>We couldn't search profiles right now. Please try again.</p><small>If this continues, profile search permissions may need adjusting in Supabase.</small></div>`;
return;
}
const merged=[...(byUsername.data||[]),...(byName.data||[])];
const unique=[...new Map(merged.map(p=>[p.id,p])).values()].filter(p=>p.id!==currentUser.id);
if(!unique.length){results.innerHTML=`<div class="empty"><div class="big">♡</div><p>No people found for "${esc(q)}".</p></div>`;return}
results.innerHTML=unique.map(p=>`

</div>`).join("");
}

// FOLLOWERS AND FOLLOWING

function followerCount(userId){
  return relationships.filter(
    x=>x.following_id===userId
  ).length;
}

function followingCount(userId){
  return relationships.filter(
    x=>x.follower_id===userId
  ).length;
}

function amFollowing(userId){
  return relationships.some(
    x=>x.follower_id===currentUser.id &&
       x.following_id===userId
  );
}

function followsMe(userId){
  return relationships.some(
    x=>x.follower_id===userId &&
       x.following_id===currentUser.id
  );
}

function isMutualFollower(userId){
  return amFollowing(userId) && followsMe(userId);
}

  if(userId===currentUser.id){
    viewedProfile=null;
    currentPage="profile";
    renderProfile();
    return;
  }

  const {data:p,error}=await db.from("profiles")
    .select("*")
    .eq("id",userId)
    .single();

  if(error || !p){
    toast("Could not find this profile.");
    return;
  }

  p.avatarDisplayUrl=null;

  if(p.avatar_url){

    if(p.avatar_url.startsWith("http")){
      p.avatarDisplayUrl=p.avatar_url;

    }else{
      const {data:imageData,error:imageError}=await db.storage
        .from("stanspace-images")
        .createSignedUrl(p.avatar_url,3600);

      if(!imageError && imageData){
        p.avatarDisplayUrl=imageData.signedUrl;
      }
    }
  }

  viewedProfile=p;
  currentPage="profile";
  renderProfile();
}


// FOLLOW / UNFOLLOW
async function toggleFollow(userId){

  if(!currentUser || userId===currentUser.id)return;

  // Check whether either user has blocked the other
  const {data:blocks,error:blockError}=await db
    .from("user_blocks")
    .select("id")
    .or(
      `and(blocker_id.eq.${currentUser.id},blocked_id.eq.${userId}),and(blocker_id.eq.${userId},blocked_id.eq.${currentUser.id})`
    );

  if(blockError){
    console.error(blockError);
    toast("Could not verify block status. Please try again.");
    return;
  }

  if(blocks && blocks.length){
    toast("You cannot follow this user.");
    return;
  }

  const following=amFollowing(userId);

  const result=following
    ? await db.from("follows")
        .delete()
        .eq("follower_id",currentUser.id)
        .eq("following_id",userId)

    : await db.from("follows")
        .insert({
          follower_id:currentUser.id,
          following_id:userId
        });

  if(result.error){
    toast("Could not update follow: "+result.error.message);
    return;
  }

  await loadRelationships();

  if(!following){
    await loadNotifications();
  }

  toast(following?"Unfollowed.":"Following ♡");

  renderProfile();
  updateNotificationBadges();
}
// FOLLOWERS / FOLLOWING LIST

async function showFollowList(userId,type){

  const isFollowers=type==="followers";

  const rows=relationships.filter(x=>
    isFollowers
      ? x.following_id===userId
      : x.follower_id===userId
  );

  const ids=rows.map(x=>
    isFollowers
      ? x.follower_id
      : x.following_id
  );

  if(!ids.length){

    $("modalRoot").innerHTML=`
      <div class="modal-back"
        onclick="if(event.target===this)closeModal()">

        <div class="modal">
          <h2>${isFollowers?"Followers":"Following"}</h2>

          <div class="empty">No ${type} yet ♡</div>

          <button class="btn secondary"
            onclick="closeModal()">Close</button>
        </div>
      </div>`;

    return;
  }

  const {data:people,error}=await db.from("profiles")
    .select("id,username,display_name,avatar_url")
    .in("id",ids);

  if(error){
    toast("Could not load people: "+error.message);
    return;
  }

  // Preserve the original relationship order
  const ordered=ids
    .map(id=>people.find(p=>p.id===id))
    .filter(Boolean);

  // Generate signed profile picture URLs
  for(const person of ordered){

    person.avatarDisplayUrl=null;

    if(!person.avatar_url)continue;

    if(person.avatar_url.startsWith("http")){
      person.avatarDisplayUrl=person.avatar_url;
      continue;
    }

    const {data:imageData,error:imageError}=await db.storage
      .from("stanspace-images")
      .createSignedUrl(person.avatar_url,3600);

    if(!imageError && imageData){
      person.avatarDisplayUrl=imageData.signedUrl;
    }
  }

  $("modalRoot").innerHTML=`
    <div class="modal-back"
      onclick="if(event.target===this)closeModal()">

      <div class="modal">

        <h2>${isFollowers?"Followers":"Following"} ♡</h2>

        ${ordered.map(p=>`
          <div class="settings-row">

            <div
              style="display:flex;align-items:center;gap:10px;cursor:pointer"
              onclick="closeModal();openUserProfile('${p.id}')">

              ${avatar(p.display_name||p.username,p.avatarDisplayUrl)}

              <div>
                <b>${esc(p.display_name||p.username)}</b>
                <div class="sub">@${esc(p.username)}</div>
              </div>

            </div>

          </div>
        `).join("")}

        <button class="btn secondary"
          style="margin-top:12px"
          onclick="closeModal()">Close</button>

      </div>
    </div>`;
}

async function blockUser(userId){

  if(!currentUser || userId===currentUser.id)return;

  const confirmed=confirm(
    "Block this user? This will remove your follow connections and prevent private messaging."
  );

  if(!confirmed)return;

  // Save the block first
  const {error:blockError}=await db.from("user_blocks").insert({
    blocker_id:currentUser.id,
    blocked_id:userId
  });

  if(blockError){
    if(blockError.code==="23505"){
      toast("This user is already blocked.");
    }else{
      console.error(blockError);
      toast("Could not block this user: "+blockError.message);
    }
    return;
  }

  // Remove follow connections in both directions
  const {error:followError}=await db.from("follows")
    .delete()
    .or(
      `and(follower_id.eq.${currentUser.id},following_id.eq.${userId}),and(follower_id.eq.${userId},following_id.eq.${currentUser.id})`
    );

  if(followError){
    console.error("Follow removal error:",followError);
    toast("User blocked, but follow connections could not be removed.");
  }else{
    toast("User blocked and follow connections removed. ♡");
  }

  // Close any conversation with this person
  if(activeConversationId===userId){
    activeConversationId=null;
  }

  await loadRelationships();

  viewedProfile=null;
  showPage("home");
}

async function submitUserReport(event,userId){
  event.preventDefault();

  if(!currentUser || userId===currentUser.id)return;

  const category=$("userReportCategory").value;
  const details=$("userReportDetails").value.trim();
  const button=$("userReportSubmit");

  if(!category || !details){
    toast("Please complete all fields.");
    return;
  }

  button.disabled=true;
  button.textContent="Submitting...";

  const {error}=await db.from("feedback_reports").insert({
    user_id:currentUser.id,
    reported_user_id:userId,
    type:"complaint",
    category,
    subject:"User report: "+category,
    message:details
  });

  if(error){
    console.error(error);
    button.disabled=false;
    button.textContent="Submit Report";
    toast("Could not submit report. Please try again.");
    return;
  }

  closeModal();
  toast("Report submitted. Thank you for helping keep STANSPACE safe. ♡");

async function saveProfile(){
  const updates={
    display_name:$("editDisplay").value.trim(),
    country:$("editCountry").value.trim(),
    bio:$("editBio").value.trim()
  };

  const file=$("editAvatar")?.files?.[0];
  let newAvatarPath=null;

  if(!updates.display_name){
    toast("Display name cannot be empty.");
    return;
  }

  if(file){
    if(!file.type.startsWith("image/")){
      toast("Please select an image file.");
      return;
    }

    if(file.size>5*1024*1024){
      toast("Image must be smaller than 5 MB.");
      return;
    }
  }

  const button=$("saveProfileButton");
  if(button){
    button.disabled=true;
    button.textContent="Saving...";
  }

  try{
    if(file){
      const extension=file.name.split(".").pop()
        .toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";

      newAvatarPath=
        `${currentUser.id}/avatars/${crypto.randomUUID()}.${extension}`;

      const {error:uploadError}=await db.storage
        .from("stanspace-images")
        .upload(newAvatarPath,file,{
          contentType:file.type,
          upsert:false
        });

      if(uploadError)throw uploadError;

      updates.avatar_url=newAvatarPath;
    }

    const {error}=await db.from("profiles")
      .update(updates)
      .eq("id",currentUser.id);

    if(error)throw error;

    const oldAvatarPath=profile.avatar_url;

    profile={...profile,...updates};

    if(file){
      const {data:imageData,error:signedUrlError}=await db.storage
  .from("stanspace-images")
  .createSignedUrl(newAvatarPath,3600);

if(signedUrlError){
  console.error("AVATAR SIGNED URL ERROR:",signedUrlError);
  toast("Picture uploaded but could not display: "+signedUrlError.message);
  profile.avatarDisplayUrl=null;
}else{
  profile.avatarDisplayUrl=imageData?.signedUrl||null;
}
      if(oldAvatarPath && !oldAvatarPath.startsWith("http")){
        await db.storage.from("stanspace-images")
          .remove([oldAvatarPath]);
      }
    }

    closeModal();
    renderProfile();
    toast("Profile updated ♡");

  }catch(error){
    if(newAvatarPath){
      await db.storage.from("stanspace-images")
        .remove([newAvatarPath]);
    }

    toast("Could not update profile: "+error.message);

    if(button){
      button.disabled=false;
      button.textContent="Save changes";
    }
  }
}

async function loadBlockedAccounts(){

  const {data:blocks,error}=await db
    .from("user_blocks")
    .select("blocked_id")
    .eq("blocker_id",currentUser.id);

  if(error){
    console.error(error);
    container.innerHTML=

    return;

  if(!blocks || blocks.length===0){
    container.innerHTML=

  const ids=blocks.map(b=>b.blocked_id);

  const {data:users,error:userError}=await db

// STARTUP

let messageRealtimeChannel = null;


function setupMessageRealtime(){
  if(!currentUser) return;

  if(messageRealtimeChannel){
    db.removeChannel(messageRealtimeChannel);
    messageRealtimeChannel = null;
  }

  messageRealtimeChannel = db
    .channel("messages-" + currentUser.id)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages"
      },
      async (payload) => {
        const newMessage = payload.new;

console.log("REALTIME EVENT RECEIVED:", newMessage);

        if(
          newMessage.sender_id === currentUser.id ||
          newMessage.receiver_id === currentUser.id
        ){
          if(currentPage === "messages"){
            await renderMessages();
          }else{
            await loadUnreadMessages();
            updateMessageBadges();
          }
        }
      }
    )
    .subscribe((status) => {
  console.log("Message realtime status:", status);
  console.log("Realtime channel:", messageRealtimeChannel);
});
}

async function start(){
  const {data,error}=await db.auth.getSession();

  if(error){
    showWelcome();
    return;
  }

  session=data.session;

  if(session){
    await loadApp();
    setupMessageRealtime();
  }else{
    showWelcome();
  }

  db.auth.onAuthStateChange((event,newSession)=>{
    session=newSession;

    if(event==="PASSWORD_RECOVERY"){
      recoveryMode=true;
      showResetPassword();
      return;
    }

    if(newSession&&!currentUser&&!recoveryMode){
      setTimeout(async()=>{
        await loadApp();
        setupMessageRealtime();
      },0);
    }
    else if(!newSession&&!recoveryMode){
      if(messageRealtimeChannel){
        db.removeChannel(messageRealtimeChannel);
        messageRealtimeChannel=null;
      }

      currentUser=null;
      profile=null;
      myFandoms=[];
      posts=[];
      relationships=[];
      notifications=[];
      messageRows=[];
      messagePeople={};
      unreadMessages=0;
      activeConversationId=null;

      showWelcome();
    }
  });
}


start();
